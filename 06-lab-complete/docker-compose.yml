# ============================================================
# Agent + Redis bằng một lệnh:  docker compose up --build
# Test: curl http://localhost:8000/health
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env            # AGENT_API_KEY và các biến khác (xem .env.example)
        required: false       # không có .env vẫn chạy được
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data      # rate limit + chi phí còn sau khi restart Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
